[package]
name = "openworks-agent"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Services", "Win32_System_Registry", "Win32_System_ApplicationInstallationAndServicing"] }
