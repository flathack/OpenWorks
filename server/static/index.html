<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#192951" />
    <title>OpenWorks · Verwaltung</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/catalog.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <section id="login" class="welcome" hidden>
      <form id="login-form" class="login-card">
        <div class="brand"><i aria-hidden="true"></i>OpenWorks</div>
        <h1>Verwaltung öffnen</h1>
        <label
          >Admin-Passwort<input
            name="password"
            type="password"
            autocomplete="current-password"
            required
            autofocus
        /></label>
        <p class="error" role="alert"></p>
        <button>Anmelden</button>
      </form>
    </section>
    <div id="shell" hidden>
      <header class="topbar">
        <div class="brand"><i aria-hidden="true"></i>OpenWorks</div>
        <span class="product">Management Console</span>
        <div class="session">
          <span>Administrator</span><button id="logout">Abmelden</button>
        </div>
      </header>
      <aside class="sidebar">
        <nav aria-label="Hauptnavigation"></nav>
        <details open>
          <summary>Bundle-Aufgaben</summary>
          <div class="side-links">
            <button data-do="bundle">Bundle anlegen</button
            ><button data-do="assign">Zuweisung anlegen</button>
          </div>
        </details>
        <details open>
          <summary>Favoriten</summary>
          <div id="favorites" class="side-links"></div>
        </details>
      </aside>
      <main>
        <div class="workspace-tabs">
          <button data-section="dashboard">Dashboard</button
          ><button data-section="bundles">Bundles</button>
        </div>
        <h1 id="heading"></h1>
        <div id="page"></div>
      </main>
    </div>
    <dialog id="modal">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="quiet" id="close" aria-label="Schließen">
          ×
        </button>
      </div>
      <form id="editor">
        <div id="fields"></div>
        <p class="error" role="alert"></p>
        <footer>
          <button type="button" class="secondary" id="cancel">Abbrechen</button
          ><button id="save">Speichern</button>
        </footer>
      </form>
    </dialog>
    <p id="notice" role="status" hidden></p>
  </body>
</html>
